name: レース結果取込（全着順）

on:
  # 時刻は UTC（日本時間 = UTC + 9時間）
  # 土・日・月 18:00 (JST)。「レース結果取込」（上位5頭と傾向）のあとに動かし、
  # 同じ開催日・競馬場の結果を全着順で入れ直す
  schedule:
    - cron: "0 9 * * 0,1,6"
  # 手動実行（過去の結果をまとめて取り込みたいとき）
  workflow_dispatch:
    inputs:
      target_dates:
        description: "対象日 yyyyMMdd か 期間 yyyyMMdd-yyyyMMdd をスペース区切りで（空なら直近4日）"
        required: false

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    # 1年分で2時間ほどかかる（keibalab への負荷を抑えるため1ページずつ間をあけて取得している）
    timeout-minutes: 350
    env:
      TZ: Asia/Tokyo
      LANG: C.UTF-8
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      TARGET_DATES: ${{ inputs.target_dates }}
    steps:
      # Supabase 版のコードは modernize ブランチにある
      - uses: actions/checkout@v5
        with:
          ref: modernize/java-20260805104936

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: ビルド
        working-directory: artifact
        run: mvn -B -q package -DskipTests

      - name: レース結果（全着順）を取込
        working-directory: artifact
        run: |
          set -o pipefail
          # TARGET_DATES はスペース区切りの引数として渡す（クォートしない）
          java -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -jar target/artifact-0.0.1-SNAPSHOT.jar results $TARGET_DATES 2>&1 | tee run.log
          registered=$(grep -c "頭分の結果を登録しました" run.log || true)
          failed=$(grep -c "取得できませんでした" run.log || true)
          echo "::notice title=取込結果::登録 ${registered} 開催 / 取得できなかったレース ${failed} 件"
          {
            echo "### 取込結果"
            echo "- 登録した開催（日付×競馬場）: ${registered} 件"
            echo "- 取得できなかったレース: ${failed} 件"
            echo ""
            grep -E "頭分の結果を登録しました" run.log | tail -20 | sed 's/^/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"

      # 失敗したら Issue を作って知らせる（GitHub のメール・アプリに届く）。
      # 同じワークフローの Issue が開いたままなら、新しく作らずにコメントを足す（30分ごとの失敗で Issue が増えないように）
      - name: 失敗を Issue で知らせる
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
          OWNER: ${{ github.repository_owner }}
        run: |
          title="⚠ ${WORKFLOW} が失敗しました"
          {
            echo "${WORKFLOW} が失敗しました（$(date '+%Y/%m/%d %H:%M')）"
            echo ""
            echo "- 実行: ${RUN_URL}"
            if [ -f artifact/run.log ]; then
              echo ""
              echo "ログの最後:"
              echo '```'
              tail -n 15 artifact/run.log
              echo '```'
            else
              echo "- ビルドか準備の段階で失敗しています（実行のページでログを確認してください）"
            fi
          } > body.md
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title ${WORKFLOW} が失敗しました" --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else
            {
              echo "@${OWNER}"
              cat body.md
              echo ""
              echo "直したらこの Issue を閉じてください。開いている間は、同じワークフローの失敗をここにコメントで足します。"
            } > new.md
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file new.md
          fi
