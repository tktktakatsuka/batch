name: レース結果取込

on:
  # 毎週 土・日・月 17:30 (JST) = 08:30 (UTC)
  # 開催のない日・開催場はページが取得できずスキップされる
  # 定時の自動実行は止めている。keibalab が GitHub からの接続を受け付けなくなったため（2026/10/17〜）、
  # 取り込みは PC のタスクスケジューラ（KeibaBatch・KeibaLive）で動かしている
  # 手動実行（日付・開催場を指定して再取込したいとき）
  workflow_dispatch:
    inputs:
      target_date:
        description: "対象日 yyyyMMdd（空なら当日）"
        required: false
      target_jo:
        description: "開催場をカンマ区切りで（空なら全10場）例: 東京,京都"
        required: false

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo
      LANG: C.UTF-8
      TARGET_DATE: ${{ inputs.target_date }}
      TARGET_JO: ${{ inputs.target_jo }}
      # 他のワークフローと同じ Secrets を使う（secret キーは RLS を通るので、ユーザーのトークンは不要）
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      # Supabase 版のコードは modernize ブランチにある
      - uses: actions/checkout@v5
        with:
          ref: modernize/java-20260805104936

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: ビルド
        working-directory: artifact
        run: mvn -B -q package -DskipTests

      - name: レース結果・傾向を取込
        working-directory: artifact
        run: |
          set -o pipefail
          java -Dfile.encoding=UTF-8 -jar target/artifact-0.0.1-SNAPSHOT.jar 2>&1 | tee run.log
          inserted=$(grep -c "Supabase insert succeeded" run.log || true)
          skipped=$(grep -c "登録済みのためスキップ" run.log || true)
          failed=$(grep -c -E "Supabase insert failed|Error inserting data to Supabase|既存データを確認できない" run.log || true)
          echo "::notice title=取込結果::登録 ${inserted} 件 / 登録済みスキップ ${skipped} 件 / 失敗 ${failed} 件"
          {
            echo "### 取込結果"
            echo "- 登録: ${inserted} 件"
            echo "- 登録済みのためスキップ: ${skipped} 件"
            echo "- 失敗: ${failed} 件"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$failed" -gt 0 ]; then
            grep -E "Supabase insert failed|Error inserting data to Supabase|既存データを確認できない" run.log | head -5
            echo "::error title=取込失敗::Supabase への登録または確認に失敗したデータがあります"
            exit 1
          fi

      # 失敗したら Issue を作って知らせる（GitHub のメール・アプリに届く）。
      # 同じワークフローの Issue が開いたままなら、新しく作らずにコメントを足す（30分ごとの失敗で Issue が増えないように）
      - name: 失敗を Issue で知らせる
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
          OWNER: ${{ github.repository_owner }}
        run: |
          title="⚠ ${WORKFLOW} が失敗しました"
          {
            echo "${WORKFLOW} が失敗しました（$(date '+%Y/%m/%d %H:%M')）"
            echo ""
            echo "- 実行: ${RUN_URL}"
            if [ -f artifact/run.log ]; then
              echo ""
              echo "ログの最後:"
              echo '```'
              tail -n 15 artifact/run.log
              echo '```'
            else
              echo "- ビルドか準備の段階で失敗しています（実行のページでログを確認してください）"
            fi
          } > body.md
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title ${WORKFLOW} が失敗しました" --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else
            {
              echo "@${OWNER}"
              cat body.md
              echo ""
              echo "直したらこの Issue を閉じてください。開いている間は、同じワークフローの失敗をここにコメントで足します。"
            } > new.md
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file new.md
          fi
