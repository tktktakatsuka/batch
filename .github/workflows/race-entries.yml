name: 出馬表取込

on:
  # 時刻は UTC（日本時間 = UTC + 9時間）
  schedule:
    - cron: "0 9 * * 4,5"    # 木・金 18:00 (JST) 出馬表確定・枠順確定のあと
    - cron: "0 22 * * 5,6"   # 土・日 7:00 (JST) 当日朝の出走取消を反映
  # 手動実行（日付を指定して取り直したいとき）
  workflow_dispatch:
    inputs:
      target_dates:
        description: "対象日 yyyyMMdd をスペース区切りで（空なら今日から7日以内の開催日すべて）"
        required: false

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo
      LANG: C.UTF-8
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      # Supabase 版のコードは modernize ブランチにある
      - uses: actions/checkout@v5
        with:
          ref: modernize/java-20260805104936

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: ビルド
        working-directory: artifact
        run: mvn -B -q package -DskipTests

      - name: 出馬表を取込
        working-directory: artifact
        run: |
          set -o pipefail
          java -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -jar target/artifact-0.0.1-SNAPSHOT.jar entries ${{ inputs.target_dates }} 2>&1 | tee run.log
          {
            echo "### 取込結果"
            grep -E "頭を登録しました|出馬表がまだありません" run.log | sed 's/^/- /' || echo "- 開催日がありませんでした"
          } >> "$GITHUB_STEP_SUMMARY"

      # 失敗したら Issue を作って知らせる（GitHub のメール・アプリに届く）。
      # 同じワークフローの Issue が開いたままなら、新しく作らずにコメントを足す（30分ごとの失敗で Issue が増えないように）
      - name: 失敗を Issue で知らせる
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
          OWNER: ${{ github.repository_owner }}
        run: |
          title="⚠ ${WORKFLOW} が失敗しました"
          {
            echo "${WORKFLOW} が失敗しました（$(date '+%Y/%m/%d %H:%M')）"
            echo ""
            echo "- 実行: ${RUN_URL}"
            if [ -f artifact/run.log ]; then
              echo ""
              echo "ログの最後:"
              echo '```'
              tail -n 15 artifact/run.log
              echo '```'
            else
              echo "- ビルドか準備の段階で失敗しています（実行のページでログを確認してください）"
            fi
          } > body.md
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title ${WORKFLOW} が失敗しました" --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else
            {
              echo "@${OWNER}"
              cat body.md
              echo ""
              echo "直したらこの Issue を閉じてください。開いている間は、同じワークフローの失敗をここにコメントで足します。"
            } > new.md
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file new.md
          fi
