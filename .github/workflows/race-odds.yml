name: オッズ更新

on:
  # 自動実行は止めている。30分ごとに keibalab を読みに行くと GitHub からの接続がまとめて弾かれ、
  # 出馬表・結果の取り込みまで失敗したため（2026/10/17）。オッズはアプリが出走表を開いたときに取る
  # 手動実行（祝日の月曜開催など）
  workflow_dispatch:
    inputs:
      target_date:
        description: "対象日 yyyyMMdd（空なら今日）"
        required: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 20
    # 前の実行が終わる前に次が始まったら、前の実行を待たずに新しい方だけ動かす
    concurrency:
      group: race-odds
      cancel-in-progress: true
    env:
      TZ: Asia/Tokyo
      LANG: C.UTF-8
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      # Supabase 版のコードは modernize ブランチにある
      - uses: actions/checkout@v5
        with:
          ref: modernize/java-20260805104936

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: ビルド
        working-directory: artifact
        run: mvn -B -q package -DskipTests

      - name: 単勝オッズを更新
        working-directory: artifact
        run: |
          set -o pipefail
          java -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -jar target/artifact-0.0.1-SNAPSHOT.jar odds ${{ inputs.target_date }} 2>&1 | tee run.log
          {
            echo "### 更新結果"
            grep -E "オッズを更新しました|開催がありません|更新できなかったレース" run.log | sed 's/^/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"

      # 失敗したら Issue を作って知らせる（GitHub のメール・アプリに届く）。
      # 同じワークフローの Issue が開いたままなら、新しく作らずにコメントを足す（30分ごとの失敗で Issue が増えないように）
      - name: 失敗を Issue で知らせる
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
          OWNER: ${{ github.repository_owner }}
        run: |
          title="⚠ ${WORKFLOW} が失敗しました"
          {
            echo "${WORKFLOW} が失敗しました（$(date '+%Y/%m/%d %H:%M')）"
            echo ""
            echo "- 実行: ${RUN_URL}"
            if [ -f artifact/run.log ]; then
              echo ""
              echo "ログの最後:"
              echo '```'
              tail -n 15 artifact/run.log
              echo '```'
            else
              echo "- ビルドか準備の段階で失敗しています（実行のページでログを確認してください）"
            fi
          } > body.md
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title ${WORKFLOW} が失敗しました" --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else
            {
              echo "@${OWNER}"
              cat body.md
              echo ""
              echo "直したらこの Issue を閉じてください。開いている間は、同じワークフローの失敗をここにコメントで足します。"
            } > new.md
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file new.md
          fi
