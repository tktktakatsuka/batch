supabase.key=sb_publishable_VVjQm-MYv0zI97b-nyJMrA_0NYxWmnp

# テーブルマッピング: supabase.table.<firebaseRoot>=<supabase_table>
# 例: Firebase のパス先頭が "raceResult" の場合、Supabase のテーブル名 "race_result" にマップする
## Map various firebase root names to the Supabase table `race_results`
supabase.table.raceResult=race_results
supabase.table.raceResults=race_results
supabase.table.race_result=race_results
supabase.table.race_results=race_results
supabase.table.race_trends=race_trends

# 許可カラムリスト（race_results のスキーマに合わせる）
